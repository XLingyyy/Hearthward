<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hearthward · TASK-020 逐页对照</title>
<style>body{margin:0;background:#151615;color:#e5dfcf;font:16px/1.6 system-ui}main{max-width:1672px;margin:auto;padding:24px}h1{font-size:24px;margin:0 0 8px}p{color:#c0baac;margin:8px 0 18px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;background:#252823;color:inherit;border:1px solid #626650;padding:7px 15px;cursor:pointer}button[aria-pressed=true]{background:#655b37;border-color:#cfb76d}#stage{position:relative;width:100%;aspect-ratio:1672/941;overflow:hidden;background:#000;border:1px solid #514c3e}#stage img{position:absolute;width:100%;height:100%;object-fit:contain;inset:0}#actual{clip-path:inset(0 50% 0 0)}#line{position:absolute;left:50%;height:100%;border-left:2px solid #edca67;pointer-events:none}.labels{display:flex;justify-content:space-between;color:#e6cd82}input{width:100%;accent-color:#ddc16e}a{color:#ddc16e}.controls{display:flex;align-items:center;gap:16px;margin:8px 0}</style>
<main><h1>归火 · 九页参考与实机渲染对照</h1><p>1672 × 941 原生UE UI截图。左侧为实现，右侧为参考；拖动滑杆查看同一区域。数值、任务与解锁状态来自真实测试进度。95%目标尚未认定达标。</p><nav id="pages"></nav><div class="controls"><label>显示方式 <select id="mode"><option value="split">滑动对照</option><option value="actual">只看实现</option><option value="reference">只看参考</option></select></label><a id="openActual" target="_blank">实现原图</a><a id="openRef" target="_blank">参考原图</a></div><div class="labels"><span>实现 · 原生UI</span><span>用户参考</span></div><div id="stage"><img id="reference" alt="用户参考原图"><img id="actual" alt="原生UI渲染"><div id="line"></div></div><input id="slider" type="range" min="0" max="100" value="50" aria-label="实现画面占比"><p id="note"></p><p><a href="physical-final-hud.png">实际三维场景与HUD</a> · <a href="physical-final-collection.png">实键图鉴切换</a> · <a href="visual-comparison.json">图像差异指标与限制</a></p></main>
<script>const pages=[["title", "标题页"], ["inventory", "背包"], ["storage", "箱子"], ["pause", "暂停界面"], ["dialogue", "对话"], ["map", "地图"], ["skills", "技能树"], ["journal", "任务栏"], ["hud", "普通状态"]];let selected=0;const $=id=>document.getElementById(id);function render(){const [id,name]=pages[selected];$('actual').src=id+'.png';$('reference').src='../../../../ui pic/'+name+'.png';$('openActual').href=$('actual').src;$('openRef').href=$('reference').src;$('note').textContent=id==='hud'?'HUD图仅为UI层，透明区显示黑色；此图不包含三维世界。实际游戏灰盒画面见下方链接，最后透明图集的外观以此原生UI截图为准。':'插画、装饰和图标为美术资产；文字、数值、物品、技能、地图标记和按钮独立绘制。差异指标不等同于视觉还原率。';document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));update()}function update(){let value=$('mode').value==='actual'?100:$('mode').value==='reference'?0:Number($('slider').value);$('actual').style.clipPath=`inset(0 ${100-value}% 0 0)`;$('line').style.left=value+'%';$('line').style.display=$('mode').value==='split'?'block':'none'}pages.forEach(([id,name],i)=>{let b=document.createElement('button');b.textContent=name;b.onclick=()=>{selected=i;render()};$('pages').append(b)});$('slider').oninput=update;$('mode').onchange=update;render();</script></html>
