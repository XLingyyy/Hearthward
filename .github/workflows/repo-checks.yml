name: Repository policy
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  repo-policy:
    name: repo-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout reviewed action revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 1
          lfs: false
      - name: Validate repository documents and task snapshots
        run: |
          python3 --version
          python3 scripts/validate_repo.py
      - name: Test repository helper tools
        run: python3 -m unittest discover -s scripts/tests -v
# Only repository policy, not UE build or gameplay testing.
# No secrets, no self-hosted runner, no automatic task ownership or LFS lock assertions.
# Add to branch Required checks only after the job actually runs in your repository.
