; Native 1080p TAA avoids supersampling cost. Bound distant grass and texture
; residency while keeping the denser near-field grass and Epic effects.
[AntiAliasingQuality@3]
r.TemporalAA.Quality=2
r.TemporalAAFilterSize=0.8
r.Tonemapper.Sharpen=0.35

[ViewDistanceQuality@3]
; Preserve the map's authored vegetation fade distances. UE's stock Epic
; multiplier doubles them, rendering small alpha cards past their useful range.
r.ViewDistanceScale=1.0

[GlobalIlluminationQuality@2]
r.SSGI.Quality=2

[GlobalIlluminationQuality@3]
r.SSGI.Quality=3

[TextureQuality@3]
r.Streaming.PoolSize=2048

[ShadowQuality@3]
r.Shadow.MaxCSMResolution=2048
r.VolumetricFog.GridPixelSize=16
r.VolumetricFog.GridSizeZ=96
r.Shadow.Virtual.ResolutionLodBiasDirectional=0
r.Shadow.Virtual.SMRT.RayCountDirectional=4
r.Shadow.Virtual.SMRT.RayCountLocal=4

[FoliageQuality@3]
grass.DensityScale=1.35
grass.CullDistanceScale=0.8
